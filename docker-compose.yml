version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: playconnect_db
    restart: always
    environment:
      POSTGRES_USER: playconnect_user
      POSTGRES_PASSWORD: playconnect_password
      POSTGRES_DB: playconnect_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playconnect_user -d playconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
